# Google Trends 姣忔棩鑷姩閲囬泦涓庡垎鏋?
# GitHub Actions 瀹氭椂宸ヤ綔娴?
#
# 瑙﹀彂鏂瑰紡:
#   1. 姣忓ぉ鍖椾含鏃堕棿 02:00 鑷姩鎵ц (UTC 18:00)
#   2. 鏀寔鎵嬪姩瑙﹀彂
#
# 鍓嶆彁鏉′欢:
#   鍦?GitHub 浠撳簱 Settings > Secrets and variables > Actions 涓坊鍔?
#   - DATABASE_URL:  Neon PostgreSQL 杩炴帴瀛楃涓?

name: Daily Trends Collection

on:
  schedule:
    # UTC 18:00 = 鍖椾含鏃堕棿 02:00
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRENDS_KEYWORDS: "artificial intelligence,machine learning,cryptocurrency,electric vehicles,online learning"
          TRENDS_REGIONS: ",US,GB"
          TRENDS_TIMEFRAME: "today 3-m"
        run: |
          cd backend
          mkdir -p logs
          python run_daily.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 7
