# Google Trends 每日自动采集与分析
# GitHub Actions 定时工作流
#
# 触发方式:
#   1. 每天北京时间 02:00 自动执行 (UTC 18:00)
#   2. 支持手动触发
#
# 前提条件:
#   在 GitHub 仓库 Settings > Secrets and variables > Actions 中添加:
#   - SUPABASE_URL:  Supabase 项目 URL
#   - SUPABASE_KEY:  Supabase anon key

name: Daily Trends Collection

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00
    - cron: '0 18 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. 执行每日任务（采集 + 分析 + 机会检测）
      - name: Run daily pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRENDS_KEYWORDS: ${{ secrets.TRENDS_KEYWORDS }}
          TRENDS_REGIONS: ${{ secrets.TRENDS_REGIONS }}
        run: |
          cd backend
          mkdir -p logs
          python run_daily.py

      # 5. 上传日志（方便排查问题）
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 7
