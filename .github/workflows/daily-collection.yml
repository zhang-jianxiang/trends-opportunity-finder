# Google Trends 每日自动采集与分析
# GitHub Actions 定时工作流
#
# 触发方式:
#   1. 每天北京时间 02:00 自动执行 (UTC 18:00)
#   2. 支持手动触发
#
# 前提条件:
#   在 GitHub 仓库 Settings > Secrets and variables > Actions 中添加:
#   - DATABASE_URL:  Neon PostgreSQL 连接字符串

name: Daily Trends Collection

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRENDS_KEYWORDS: ${{ secrets.TRENDS_KEYWORDS }}
          TRENDS_REGIONS: ${{ secrets.TRENDS_REGIONS }}
        run: |
          cd backend
          mkdir -p logs
          python run_daily.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 7
